<!doctype html><meta charset="utf-8"><body>
<script type="module">
import { Compiler } from '../app/vendor/mindar/mindar-image.prod.js';
window.compileTargets = async (urls) => {
  const imgs = await Promise.all(urls.map(async (url) => { const i = new Image(); i.src = url; await i.decode(); return i; }));
  const c = new Compiler();
  await c.compileImageTargets(imgs, (p) => { window.progress = p; });
  const u = new Uint8Array(await c.exportData());
  let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script>
