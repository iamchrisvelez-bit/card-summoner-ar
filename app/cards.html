<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Cards</title>
  <style>
    :root { --bg: #ffffff; --text: #1a1a1a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #eee; } }
    body { margin: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    .sheet { display: flex; flex-wrap: wrap; gap: 4mm; }
    /* Real poker-card size so the printed card matches the board's zones. */
    img { width: 63mm; height: 88mm; display: block; }
    @media print { body { margin: 0; } p { display: none; } }
  </style>
</head>
<body>
  <p id="title">Loading…</p>
  <div class="sheet" id="sheet"></div>
  <script type="module">
    import { loadGame } from './engine/game-loader.js';
    import { drawCardFace } from './card-face.js';
    const id = new URLSearchParams(location.search).get('game') || 'zone-duel';
    const game = await loadGame(id);
    document.getElementById('title').textContent = `${game.name}: print at 100% scale, or show on another screen.`;
    for (const c of game.cards) {
      const img = new Image();
      img.src = c.imageUrl ?? drawCardFace(c, game).toDataURL();
      img.alt = c.name;
      document.getElementById('sheet').append(img);
    }
  </script>
</body>
</html>
